name: Benchmark validation

on:
  pull_request:
    paths:
      - '.gitattributes'
      - 'benchmarks/**'
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - 'docs/specs/**'
      - 'tools/**'
      - '.github/workflows/benchmark-validation.yml'
  push:
    paths:
      - '.gitattributes'
      - 'benchmarks/**'
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - 'docs/specs/**'
      - 'tools/**'
      - '.github/workflows/benchmark-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Retained sources and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-benchmarks.txt
      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r tools/requirements-benchmarks.txt
          python -m playwright install --with-deps chromium
      - name: Complete release validation
        run: python tools/validate-release.py
