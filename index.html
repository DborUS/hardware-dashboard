<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPU Architecture Roadmap</title>
<!-- Performance: Preconnect to font CDN -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=20260921-brand-2">
</head>
<body>
<div class="bg-grid"></div>
<div class="container">
  <!-- Row 1: vendor pill + ChipIndex identity. #pageHeader remains available
       to assistive technology and is updated by whichever renderer is active. -->
  <div class="topbar">
    <div class="vendor-pill" id="vendorPill" data-active="amd" role="tablist"
         aria-label="Vendor">
      <span class="vendor-pill-thumb" aria-hidden="true"></span>
      <button class="vendor-tab active-amd" id="tabAmd" role="tab"
              aria-selected="true" onclick="switchVendor('amd')">AMD</button>
      <button class="vendor-tab" id="tabIntel" role="tab"
              aria-selected="false" onclick="switchVendor('intel')">Intel</button>
      <button class="vendor-tab" id="tabNvidia" role="tab"
              aria-selected="false" onclick="switchVendor('nvidia')">NVIDIA</button>
    </div>
    <div class="brand-lockup" aria-label="ChipIndex by Dan Bor, public beta 0.0.0">
      <div class="brand-lockup-title" aria-hidden="true">
        <span class="brand-lockup-name">ChipIndex</span>
        <span class="brand-lockup-by">by Dan Bor</span>
      </div>
      <div class="brand-lockup-rule" aria-hidden="true">
        <span class="brand-lockup-rule-start"></span>
        <span class="brand-lockup-rule-end"></span>
      </div>
      <span class="brand-lockup-version" aria-hidden="true">Public beta 0.0.0</span>
    </div>
    <header id="pageHeader" class="sr-only">
      <h1 class="header-amd">EPYC</h1>
      <p>Data center processors</p>
    </header>
    <div class="v2-status" id="v2Status" role="status" aria-live="polite" hidden></div>
    <div class="v2-status" id="a2Status" role="status" aria-live="polite" hidden></div>
    <div class="v2-status" id="n2Status" role="status" aria-live="polite" hidden></div>
  </div>

  <!-- Row 2: product line, search and the expand/collapse controls together. -->
  <div class="navrow">
    <!-- AMD only: product-line sub-tabs, shown by a2Activate() -->
    <div class="v2-subtabs a2-subtabs" id="a2Subtabs" role="tablist" aria-label="AMD product line">
      <button class="v2-subtab a2-subtab active" data-tab="epyc" role="tab">EPYC</button>
      <button class="v2-subtab a2-subtab" data-tab="ryzen" role="tab">RYZEN</button>
      <button class="v2-subtab a2-subtab" data-tab="gpu" role="tab">GPU</button>
    </div>
    <!-- Intel only: product-line sub-tabs, shown by v2Activate() -->
    <div class="v2-subtabs" id="v2Subtabs" role="tablist" aria-label="Intel product line">
      <button class="v2-subtab active" data-tab="xeon" role="tab">XEON</button>
      <button class="v2-subtab" data-tab="client" role="tab">CLIENT</button>
      <button class="v2-subtab" data-tab="graphics" role="tab">GRAPHICS</button>
    </div>
    <!-- NVIDIA: data-center-first product lines. -->
    <div class="v2-subtabs n2-subtabs" id="n2Subtabs" role="tablist" aria-label="NVIDIA product line">
      <button class="v2-subtab n2-subtab active" data-tab="datacenter" role="tab">DATA CENTER</button>
      <button class="v2-subtab n2-subtab" data-tab="geforce" role="tab">GEFORCE</button>
      <button class="v2-subtab n2-subtab" data-tab="cpu" role="tab">CPU</button>
    </div>
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input type="text" id="searchInput" placeholder="Search architectures, SKUs, brands..." aria-label="Search architectures, SKUs, brands and specifications">
      <button class="search-clear" id="searchClear" aria-label="Clear search">✕</button>
    </div>
    <div class="toolbar">
      <button class="expand-all-btn" id="dataSourcesBtn">Data Sources</button>
      <button class="expand-all-btn" id="expandAllBtn">Expand All</button>
      <button class="expand-all-btn" id="collapseAllBtn">Collapse All</button>
      <button class="expand-all-btn" id="clearSelectionsBtn">Clear Selections</button>
    </div>
  </div>
  <!-- Legacy CPU/GPU tech tabs. Both vendors are product-first now, so nothing
       shows these; kept only because script.js still holds a reference. -->
  <div class="tech-tabs" id="techTabs" hidden>
    <button class="tech-tab active" id="techTabCpu" onclick="switchTech('cpu')">CPU</button>
    <div class="tech-tab-divider"></div>
    <button class="tech-tab" id="techTabGpu" onclick="switchTech('gpu')">GPU</button>
  </div>
  <!-- Two-column layout: filter sidebar + timeline. Both renderers still
       write into #filterControls; only its position changed. Collapses to a
       single column under 900px, where the sidebar becomes a disclosure. -->
  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Filters">
      <button class="sidebar-toggle" id="sidebarToggle" aria-expanded="false"
              aria-controls="filterControls">
        <span class="sidebar-toggle-label">Filters</span>
        <span class="sidebar-toggle-count" id="sidebarCount" hidden></span>
        <span class="sidebar-toggle-caret">▾</span>
      </button>
      <div class="controls" id="filterControls"></div>
    </aside>
    <main class="content">
      <div id="codenameTableWrap"></div>
      <div class="sr-only" id="filterStatus" role="status" aria-live="polite" aria-atomic="true"></div>
      <div class="timeline" id="timeline"></div>
    </main>
  </div>
</div>

<!-- Persistent selections survive vendor and product-line changes. -->
<div class="compare-tray" id="compareTray" hidden aria-live="polite">
  <div class="compare-tray-copy">
    <strong id="compareCount">0 products selected</strong>
    <span id="compareNames"></span>
  </div>
  <button class="compare-tray-btn" id="compareOpenBtn" disabled>Compare</button>
  <button class="compare-tray-clear" id="compareClearBtn">Clear</button>
</div>

<dialog class="dashboard-dialog compare-dialog" id="compareDialog" aria-labelledby="compareTitle">
  <div class="dialog-head">
    <div>
      <div class="dialog-kicker">PRODUCT COMPARISON</div>
      <h2 id="compareTitle">Selected products</h2>
    </div>
    <button class="dialog-close" data-close-dialog="compareDialog" aria-label="Close comparison">✕</button>
  </div>
  <div class="compare-scroll" id="compareContent"></div>
</dialog>

<dialog class="dashboard-dialog source-dialog" id="sourceDialog" aria-labelledby="sourceTitle">
  <div class="dialog-head">
    <div>
      <div class="dialog-kicker">DATA PROVENANCE</div>
      <h2 id="sourceTitle">Sources</h2>
    </div>
    <button class="dialog-close" data-close-dialog="sourceDialog" aria-label="Close sources">✕</button>
  </div>
  <div id="sourceContent"></div>
</dialog>

<div class="dashboard-toast" id="dashboardToast" role="status" aria-live="polite" hidden></div>

  <script src="js/intel-v2.js?v=20260921-header-1"></script>
<script src="js/amd-v2.js?v=20260921-header-1"></script>
<script src="js/nvidia-v2.js?v=20260921-header-1"></script>
<script src="js/script.js?v=20260921-header-1"></script>
</body>
</html>
